# MySQL Configuration (TiDB Cloud Serverless)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.alicloud.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${DATABASE_USERNAME:3LGtqmNKXtQranZ.root}
spring.datasource.password=${DATABASE_PASSWORD:Bf8Y1kBs13RaFsYz}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fail-fast: verify MySQL connectivity on startup
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
server.port=${PORT:8080}
# Do not rerun schema.sql/data.sql on every deploy; they can reset or mutate persistent data.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Debug Logging
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.springframework.boot.autoconfigure.jdbc=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG

# Archive Configuration (GitHub as Data Lake)
archive.github.token=${GITHUB_TOKEN:}
archive.github.owner=your_github_username
archive.github.repo=your_repo_name
archive.github.branch=main
archive.days-before-archive=30
archive.format=json

